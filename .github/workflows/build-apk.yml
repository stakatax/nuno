name: Build NUNO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      NG_BUILD_MAX_WORKERS: '2'
      NG_BUILD_PARALLEL_TS: '0'
      RAYON_NUM_THREADS: '2'

    steps:
      - name: Download project source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-36"

      - name: Install project dependencies
        run: npm ci

      - name: Build Ionic application
        run: npm run build -- --configuration production

      - name: Create Android project if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Add location and vibration permissions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');

          const permissions = [
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.VIBRATE',
          ];

          for (const permission of permissions) {
            if (!xml.includes(permission)) {
              xml = xml.replace(
                '</manifest>',
                `  <uses-permission android:name="${permission}" />\n</manifest>`
              );
            }
          }

          fs.writeFileSync(path, xml);
          NODE

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Allow Gradle to run
        run: chmod +x android/gradlew

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Name the APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/NUNO.apk

      - name: Upload APK for download
        uses: actions/upload-artifact@v7
        with:
          name: NUNO-APK
          path: apk/NUNO.apk
          if-no-files-found: error
          retention-days: 14